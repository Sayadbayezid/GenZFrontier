name: Deploy GenZ Frontier News

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install markdown python-frontmatter google-analytics-data

      - name: Snapshot Sitemap Before Build
        run: cp sitemap.xml /tmp/sitemap-before-build.xml

      - name: Run Build Script (Markdown to HTML)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: python build.py

      - name: Submit Changed URLs to IndexNow
        run: python scripts/indexnow_submit.py --sitemap sitemap.xml --previous-sitemap /tmp/sitemap-before-build.xml

      - name: Commit and Push Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if [ -n "$(git status --porcelain sitemap.xml)" ]; then
            git commit -m "chore: automated sitemap update [skip ci]"
            git push
          else
            echo "No changes to sitemap.xml"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: www.genzfrontir.com