<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Affection with room for boundaries</title>
  <desc id="desc">An editorial illustration of two warm light paths meeting without merging, representing affection, autonomy, and healthy boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6eff0"/><stop offset="0.5" stop-color="#fffaf8"/><stop offset="1" stop-color="#c4d9d9"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e5a4a3"/><stop offset="1" stop-color="#a24f5e"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ccbc5"/><stop offset="1" stop-color="#3c777a"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#3f3340" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="160" r="235" fill="#fff" opacity="0.44" filter="url(#soft)"/>
  <circle cx="185" cy="770" r="250" fill="#86b6b7" opacity="0.17" filter="url(#soft)"/>
  <path d="M800 880 C650 760 545 665 460 520 C400 418 360 315 305 185" fill="none" stroke="url(#rose)" stroke-width="112" opacity="0.74"/>
  <path d="M800 880 C950 760 1055 665 1140 520 C1200 418 1240 315 1295 185" fill="none" stroke="url(#teal)" stroke-width="112" opacity="0.78"/>
  <path d="M800 880 C650 760 545 665 460 520 C400 418 360 315 305 185" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="15 22" opacity="0.54"/>
  <path d="M800 880 C950 760 1055 665 1140 520 C1200 418 1240 315 1295 185" fill="none" stroke="#faffff" stroke-width="6" opacity="0.56"/>
  <g filter="url(#shadow)">
    <circle cx="540" cy="410" r="82" fill="#d19a80"/>
    <path d="M457 412 C460 319 515 268 590 281 C650 292 679 348 661 415 C619 376 554 365 494 394Z" fill="#40313b"/>
    <path d="M482 563 C522 494 585 484 636 514 C676 538 690 581 705 702H378Z" fill="url(#rose)"/>
