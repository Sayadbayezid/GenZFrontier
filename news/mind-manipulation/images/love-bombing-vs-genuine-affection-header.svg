  <circle cx="800" cy="505" r="26" fill="#fff" stroke="#4c8288" stroke-width="8"/>
  <path d="M768 505H832" stroke="#4c8288" stroke-width="6" stroke-linecap="round"/>
  <path d="M800 473V537" stroke="#4c8288" stroke-width="6" stroke-linecap="round"/>
  <g fill="#fff" stroke="#54858a" stroke-width="7">
    <circle cx="192" cy="170" r="18"/><circle cx="1408" cy="170" r="18"/><circle cx="800" cy="112" r="18"/>
  </g>
  <path d="M192 170L800 112L1408 170" fill="none" stroke="#54858a" stroke-width="7" opacity="0.54"/>
