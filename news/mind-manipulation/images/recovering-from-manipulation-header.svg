<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Rebuilding self-trust after manipulation</title>
  <desc id="desc">An editorial illustration of a winding path moving from fragmented shapes toward a stable compass and supportive light, representing gradual recovery and restored choice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcebed"/><stop offset="0.48" stop-color="#fcfcfa"/><stop offset="1" stop-color="#c2d9d7"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b7d8d0"/><stop offset="1" stop-color="#4b8183"/></linearGradient>
    <linearGradient id="compass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c7e3df"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#23444e" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1370" cy="160" r="260" fill="#fff" opacity="0.52" filter="url(#blur)"/>
  <circle cx="180" cy="760" r="240" fill="#8bbdbc" opacity="0.18" filter="url(#blur)"/>
  <path d="M110 750 C310 690 408 765 590 665 C760 571 790 468 980 478 C1170 488 1192 368 1450 218" fill="none" stroke="url(#path)" stroke-width="150" opacity="0.62"/>
  <path d="M110 750 C310 690 408 765 590 665 C760 571 790 468 980 478 C1170 488 1192 368 1450 218" fill="none" stroke="#fff" stroke-width="9" stroke-dasharray="18 26" opacity="0.68"/>
  <g opacity="0.78" fill="#d39198" stroke="#a55e6e" stroke-width="7">
    <path d="M210 270L298 205L385 285L318 365L220 350Z"/>
    <path d="M410 195L495 242L470 345L367 312Z"/>
    <path d="M180 420L265 380L345 438L305 527L204 518Z"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="1080" cy="355" r="184" fill="url(#compass)" stroke="#4f8587" stroke-width="10"/>
    <circle cx="1080" cy="355" r="128" fill="none" stroke="#86b5b3" stroke-width="6" opacity="0.76"/>
    <path d="M1080 216V494M941 355H1219" stroke="#6e9e9e" stroke-width="6" opacity="0.68"/>
    <path d="M1080 272L1153 408L1080 386L1007 408Z" fill="#4f8587"/>
