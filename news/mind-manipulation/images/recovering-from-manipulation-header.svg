    <circle cx="1080" cy="355" r="17" fill="#fff" stroke="#4f8587" stroke-width="7"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="1448" cy="205" r="62" fill="#fff" stroke="#5b9291" stroke-width="8"/>
    <path d="M1448 165V248M1408 205H1490" stroke="#5b9291" stroke-width="10" stroke-linecap="round"/>
    <path d="M1413 207L1440 233L1482 179" fill="none" stroke="#4f8587" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="115" cy="735" r="24" fill="#fff" stroke="#5b9291" stroke-width="8"/>
  <path d="M83 735H147" stroke="#5b9291" stroke-width="7" stroke-linecap="round"/>
</svg>
