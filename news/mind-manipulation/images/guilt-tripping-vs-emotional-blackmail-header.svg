<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A clear choice beyond emotional fog</title>
  <desc id="desc">An editorial illustration of a person beside two contrasting paths, one foggy and one clear, representing emotional pressure and independent choice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3edef"/><stop offset="0.5" stop-color="#fbfaf8"/><stop offset="1" stop-color="#c2d8da"/></linearGradient>
    <linearGradient id="clear" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a2cbc7"/><stop offset="1" stop-color="#3a7779"/></linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9c2ca"/><stop offset="1" stop-color="#7e7b89"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#263f48" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1290" cy="160" r="240" fill="#fff" opacity="0.42" filter="url(#blur)"/>
  <circle cx="190" cy="780" r="250" fill="#88b5b8" opacity="0.18" filter="url(#blur)"/>
  <path d="M810 900 C760 790 710 700 620 650 C510 590 405 518 310 378" fill="none" stroke="url(#fog)" stroke-width="120" opacity="0.74"/>
  <path d="M810 900 C860 790 930 690 1050 630 C1170 570 1300 510 1460 370" fill="none" stroke="url(#clear)" stroke-width="120" opacity="0.84"/>
  <path d="M810 900 C760 790 710 700 620 650 C510 590 405 518 310 378" fill="none" stroke="#f9f9f8" stroke-width="5" stroke-dasharray="17 23" opacity="0.55"/>
  <path d="M810 900 C860 790 930 690 1050 630 C1170 570 1300 510 1460 370" fill="none" stroke="#f8ffff" stroke-width="6" opacity="0.56"/>
  <g filter="url(#shadow)">
    <circle cx="790" cy="365" r="83" fill="#d19a80"/>
    <path d="M706 366 C709 273 762 221 838 237 C900 249 928 305 910 370 C868 330 804 317 745 344Z" fill="#2e373c"/>
    <path d="M648 535 C702 455 815 445 894 532 L970 778H572Z" fill="#5a8388"/>
