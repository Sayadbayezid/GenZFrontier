<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Regaining freedom and safe support</title>
  <desc id="desc">An editorial illustration of a figure moving through a narrowing pattern toward an open, supported space, representing coercive control, autonomy, and safety planning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3edf0"/><stop offset="0.5" stop-color="#fcfbf9"/><stop offset="1" stop-color="#bfd6d8"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9dfdf"/><stop offset="1" stop-color="#638f93"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d3edeb"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#263f48" flood-opacity="0.20"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1350" cy="170" r="240" fill="#fff" opacity="0.46" filter="url(#soft)"/>
  <circle cx="170" cy="760" r="250" fill="#8ab8ba" opacity="0.17" filter="url(#soft)"/>
  <path d="M0 0H640L820 900H0Z" fill="url(#wall)" opacity="0.72"/>
  <path d="M1600 0H1010L820 900H1600Z" fill="#8eb4b5" opacity="0.62"/>
  <path d="M500 0L820 900M1100 0L820 900" stroke="#fff" stroke-width="10" stroke-dasharray="18 22" opacity="0.42"/>
  <g filter="url(#shadow)">
    <rect x="1150" y="170" width="280" height="500" rx="16" fill="url(#light)" stroke="#4f8589" stroke-width="8"/>
    <path d="M1220 285H1360M1220 345H1320M1220 405H1370" stroke="#5b8d91" stroke-width="15" stroke-linecap="round" opacity="0.70"/>
    <circle cx="1220" cy="530" r="27" fill="#fff" stroke="#4f8589" stroke-width="8"/>
    <path d="M1204 530L1217 544L1242 514" fill="none" stroke="#4f8589" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#shadow)">
