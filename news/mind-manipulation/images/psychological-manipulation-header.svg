<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A person reflecting across a glass boundary</title>
  <desc id="desc">A calm editorial illustration representing reflection, uncertainty, personal autonomy, and healthy boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7dee2"/>
      <stop offset="0.48" stop-color="#eef2f3"/>
      <stop offset="1" stop-color="#b9c9d0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c8cc" stop-opacity="0"/>
      <stop offset="1" stop-color="#8da1a8" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="sweater" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3eee7"/>
      <stop offset="1" stop-color="#b8b6b2"/>
    </linearGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset dy="18" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect y="620" width="1600" height="280" fill="url(#floor)"/>

  <!-- Window structure and soft exterior light -->
  <rect x="620" y="0" width="24" height="900" fill="#6c7a80" opacity="0.62"/>
  <rect x="990" y="0" width="18" height="900" fill="#8c9ba0" opacity="0.42"/>
  <rect x="1270" y="0" width="16" height="900" fill="#8c9ba0" opacity="0.30"/>
  <path d="M655 0H1600V575C1350 510 1040 545 655 470Z" fill="#f8fbfc" opacity="0.42"/>
  <path d="M1005 70H1580" stroke="#ffffff" stroke-width="7" opacity="0.22"/>
  <path d="M1030 120H1500" stroke="#ffffff" stroke-width="3" opacity="0.22"/>

  <!-- Soft, indistinct background figure -->
  <g opacity="0.48" filter="url(#softBlur)">
    <circle cx="1395" cy="258" r="70" fill="#6d777b"/>
    <path d="M1328 340 C1354 300 1438 300 1464 340 L1515 650 L1277 650Z" fill="#74858b"/>
    <path d="M1320 650H1518V735H1320Z" fill="#64767c"/>
  </g>

  <!-- Main subject shadow -->
  <ellipse cx="330" cy="827" rx="270" ry="42" fill="#53666d" opacity="0.24" filter="url(#softBlur)"/>

  <!-- Main subject: seated person in reflection -->
  <g filter="url(#shadow)">
    <path d="M108 724 C134 589 205 510 304 510 C407 510 485 592 540 744 L560 900H72Z" fill="url(#sweater)"/>
    <path d="M145 696 C198 602 260 575 350 590 C400 599 449 636 484 700 L518 900H118Z" fill="#d5d3cf" opacity="0.83"/>
    <path d="M307 642 C259 647 218 680 197 733 L124 900H283L356 782L452 900H598L483 690C447 649 383 633 307 642Z" fill="#1f3540" opacity="0.92"/>
    <path d="M362 663 C407 672 451 716 477 763 L531 900H427L360 785L295 900H191L247 754C269 700 307 668 362 663Z" fill="#273d48" opacity="0.94"/>
    <path d="M260 507 C286 473 352 467 385 510 L389 591 C360 629 301 629 265 592Z" fill="#d39d82"/>
    <path d="M248 512 C242 439 289 369 366 372 C434 374 470 432 447 508 C429 479 414 461 389 450 C362 479 326 491 276 482Z" fill="#2f3033"/>
    <path d="M271 435 C302 383 388 377 427 441 C390 414 344 414 301 449Z" fill="#3b3c3e"/>
    <path d="M267 537 C289 568 343 582 385 556 L385 611 C354 650 300 650 266 611Z" fill="#cf9278" opacity="0.92"/>
    <circle cx="314" cy="505" r="6" fill="#30363a"/>
    <circle cx="383" cy="503" r="6" fill="#30363a"/>
    <path d="M322 544 C343 554 364 554 382 542" fill="none" stroke="#885a54" stroke-width="5" stroke-linecap="round"/>
    <path d="M212 638 C246 609 274 594 310 588 L296 669 L231 714Z" fill="#f0ebe4"/>
    <path d="M474 660 C439 619 410 601 374 589 L391 673 L455 716Z" fill="#c9c7c3"/>
    <path d="M305 699 C270 713 249 754 250 790 C279 804 321 809 355 795 C359 757 345 720 305 699Z" fill="#d39d82"/>
    <path d="M431 702 C399 721 382 753 386 793 C414 810 454 808 480 792 C483 758 467 724 431 702Z" fill="#d39d82"/>
  </g>

  <!-- Glass boundary -->
  <rect x="620" y="42" width="6" height="782" rx="3" fill="#ffffff" opacity="0.76"/>
  <rect x="634" y="42" width="2" height="782" fill="#69838e" opacity="0.23"/>
  <path d="M650 112H1570" stroke="#ffffff" stroke-width="4" opacity="0.26"/>
  <path d="M655 774H1540" stroke="#6d838b" stroke-width="3" opacity="0.20"/>
  <circle cx="648" cy="448" r="9" fill="#f8fcfd" opacity="0.66"/>
</svg>
