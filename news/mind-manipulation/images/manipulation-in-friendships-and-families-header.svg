<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Friendship and family boundaries</title>
  <desc id="desc">An editorial illustration of a small connected group with a clear boundary line and open paths, representing support, autonomy, and healthy limits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4eef0"/><stop offset="0.5" stop-color="#fcfbf9"/><stop offset="1" stop-color="#c0d8d8"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a2cdc8"/><stop offset="1" stop-color="#467b80"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfa9a6"/><stop offset="1" stop-color="#995b68"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6d6a8"/><stop offset="1" stop-color="#a38b57"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#263f48" flood-opacity="0.20"/></filter>
  </defs>
