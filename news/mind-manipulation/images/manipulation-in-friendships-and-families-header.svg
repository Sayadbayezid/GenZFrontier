  <circle cx="180" cy="760" r="250" fill="#89b8b9" opacity="0.18" filter="url(#soft)"/>
  <path d="M135 690 C360 530 520 510 720 550 C900 586 1110 530 1460 680" fill="none" stroke="#5f9091" stroke-width="22" opacity="0.68"/>
  <path d="M120 770 C390 690 550 700 760 740 C1000 785 1210 700 1480 770" fill="none" stroke="#fff" stroke-width="8" stroke-dasharray="18 20" opacity="0.72"/>
  <g filter="url(#shadow)">
