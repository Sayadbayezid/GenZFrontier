    <path d="M350 367 C354 278 407 234 478 246 C539 257 568 313 550 374 C510 336 446 324 387 352Z" fill="#32383d"/>
    <path d="M372 520 C414 450 516 438 584 505 L626 760H256Z" fill="url(#teal)"/>
    <circle cx="800" cy="290" r="78" fill="#d19a80"/>
