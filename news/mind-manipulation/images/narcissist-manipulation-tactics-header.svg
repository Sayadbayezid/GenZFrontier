<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Patterns, reflection, and clear boundaries</title>
  <desc id="desc">An editorial illustration of a reflective panel with branching behavior patterns and a clear boundary marker, representing self-awareness without diagnosis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e5eef0"/><stop offset="0.5" stop-color="#fcfbf9"/><stop offset="1" stop-color="#bfd5d7"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfdedc"/></linearGradient>
    <linearGradient id="path1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dba5a5"/><stop offset="1" stop-color="#9a5b68"/></linearGradient>
    <linearGradient id="path2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a2cbc6"/><stop offset="1" stop-color="#467b80"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#263f48" flood-opacity="0.20"/></filter>
  </defs>
