    <path d="M982 540L995 554L1020 524" fill="none" stroke="#4f8589" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M80 730 C260 660 390 620 510 520 C615 432 715 360 890 280" fill="none" stroke="url(#path1)" stroke-width="80" opacity="0.68"/>
  <path d="M80 770 C300 780 440 744 560 690 C690 630 790 560 910 475" fill="none" stroke="url(#path2)" stroke-width="80" opacity="0.74"/>
