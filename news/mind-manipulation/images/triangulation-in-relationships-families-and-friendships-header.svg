<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three people and clear communication paths</title>
  <desc id="desc">An editorial illustration of three connected figures with balanced paths, representing healthy support, direct communication, and the risk of triangulation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4eef0"/><stop offset="0.5" stop-color="#fbfaf8"/><stop offset="1" stop-color="#bfd7d8"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8d0cb"/><stop offset="1" stop-color="#3f777d"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfaca7"/><stop offset="1" stop-color="#985a65"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6d4a3"/><stop offset="1" stop-color="#a28b56"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#253f49" flood-opacity="0.20"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1330" cy="160" r="235" fill="#fff" opacity="0.45" filter="url(#soft)"/>
  <circle cx="190" cy="770" r="250" fill="#88b8b9" opacity="0.17" filter="url(#soft)"/>
  <g stroke="#5a878b" stroke-width="12" fill="none" opacity="0.72">
    <path d="M440 620L800 360L1160 620"/>
    <path d="M440 620L1160 620" stroke-dasharray="18 20"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="800" cy="245" r="80" fill="#d19a80"/>
    <path d="M720 247 C723 156 776 111 848 124 C910 136 939 192 921 253 C881 215 818 202 759 230Z" fill="#2e373c"/>
    <path d="M692 420 C738 345 851 335 920 411 L998 720H602Z" fill="url(#gold)"/>
    <circle cx="430" cy="585" r="80" fill="#d19a80"/>
    <path d="M350 586 C353 493 407 448 478 460 C539 472 568 528 550 590 C510 552 446 540 387 568Z" fill="#3c343d"/>
    <path d="M321 760 C360 683 470 673 545 742 L575 900H260Z" fill="url(#teal)"/>
    <circle cx="1170" cy="585" r="80" fill="#d19a80"/>
    <path d="M1090 586 C1093 493 1147 448 1218 460 C1279 472 1308 528 1290 590 C1250 552 1186 540 1127 568Z" fill="#2f3c40"/>
    <path d="M1061 760 C1100 683 1210 673 1285 742 L1315 900H1000Z" fill="url(#rose)"/>
  </g>
  <g fill="#f9ffff" stroke="#4e8288" stroke-width="8">
    <circle cx="800" cy="360" r="24"/><circle cx="440" cy="620" r="24"/><circle cx="1160" cy="620" r="24"/>
  </g>
  <path d="M770 360H830M800 330V390M410 620H470M440 590V650M1130 620H1190M1160 590V650" stroke="#4e8288" stroke-width="6" stroke-linecap="round"/>
  <path d="M120 170H410M1190 170H1480" stroke="#ffffff" stroke-width="7" opacity="0.50"/>
