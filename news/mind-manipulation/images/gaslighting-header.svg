<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A reflection and a clear light</title>
  <desc id="desc">A calm editorial illustration showing a person facing a reflective glass surface with a clear light beyond it, representing self-trust and clarity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcebed"/><stop offset="0.48" stop-color="#fbfbfa"/><stop offset="1" stop-color="#b7d2d5"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe2df"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5d858b"/><stop offset="1" stop-color="#284e5a"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#243f49" flood-opacity="0.20"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1280" cy="160" r="250" fill="#fff" opacity="0.48" filter="url(#soft)"/>
  <circle cx="210" cy="760" r="250" fill="#89b9bb" opacity="0.18" filter="url(#soft)"/>
  <rect x="1000" y="85" width="410" height="690" rx="12" fill="url(#light)" opacity="0.85"/>
  <path d="M1040 125L1370 210V735L1040 735Z" fill="#ffffff" opacity="0.30"/>
  <path d="M1018 84V780" stroke="#5f858b" stroke-width="8" opacity="0.34"/>
  <path d="M1000 84V780" stroke="#fff" stroke-width="6" opacity="0.70"/>
  <path d="M1054 156H1362M1054 214H1325" stroke="#6a989b" stroke-width="7" opacity="0.30"/>
  <g filter="url(#shadow)">
    <circle cx="470" cy="384" r="88" fill="#d19a80"/>
    <path d="M382 387 C381 291 438 239 513 253 C575 264 605 326 584 390 C545 350 481 338 417 366Z" fill="#2d3439"/>
    <path d="M325 555 C378 474 492 468 567 554 L650 820H242Z" fill="url(#coat)"/>
    <path d="M382 551 C432 520 498 516 550 554 L586 735H345Z" fill="#e5e0d6" opacity="0.55"/>
    <circle cx="438" cy="386" r="6" fill="#25373d"/><circle cx="500" cy="386" r="6" fill="#25373d"/>
    <path d="M445 422 C464 432 487 432 505 420" fill="none" stroke="#875a55" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- soft reflection -->
  <g opacity="0.23" filter="url(#soft)">
    <circle cx="832" cy="390" r="82" fill="#52737c"/>
    <path d="M756 555 C810 486 922 482 990 555 L1040 790H705Z" fill="#52737c"/>
  </g>
  <path d="M680 760H940" stroke="#ffffff" stroke-width="10" opacity="0.48"/>
  <circle cx="1000" cy="470" r="24" fill="#f9ffff" stroke="#4d838a" stroke-width="8"/>
  <path d="M968 470H1032" stroke="#4d838a" stroke-width="6" stroke-linecap="round"/>
  <path d="M1000 438V502" stroke="#4d838a" stroke-width="6" stroke-linecap="round"/>
  <g fill="#f9ffff" stroke="#57878d" stroke-width="7">
    <circle cx="1320" cy="350" r="18"/><circle cx="1400" cy="410" r="18"/><circle cx="1320" cy="470" r="18"/>
  </g>
  <path d="M1320 350L1400 410L1320 470" fill="none" stroke="#57878d" stroke-width="7" opacity="0.72"/>
</svg>
