<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Evidence separating myths from influence</title>
  <desc id="desc">An editorial illustration of a clear evidence card between a stylized maze and an open path, representing misinformation, influence, autonomy, and critical thinking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2edf0"/><stop offset="0.5" stop-color="#fcfbf9"/><stop offset="1" stop-color="#bdd5d7"/></linearGradient>
    <linearGradient id="maze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dca5a5"/><stop offset="1" stop-color="#995967"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c6e5e2"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a1ccc7"/><stop offset="1" stop-color="#477d82"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#253f48" flood-opacity="0.20"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1340" cy="170" r="240" fill="#fff" opacity="0.44" filter="url(#soft)"/>
  <circle cx="180" cy="770" r="250" fill="#8ab7b9" opacity="0.18" filter="url(#soft)"/>
  <g fill="none" stroke="url(#maze)" stroke-width="24" opacity="0.68">
    <path d="M130 170H520V280H240V410H520V540H130V680H520"/>
    <path d="M235 170V280M410 280V410M235 410V540M410 540V680"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="585" y="190" width="430" height="470" rx="22" fill="url(#card)" stroke="#4f8589" stroke-width="8"/>
    <path d="M675 300H930M675 360H875M675 420H940" stroke="#5a8d91" stroke-width="15" stroke-linecap="round" opacity="0.72"/>
    <circle cx="675" cy="535" r="29" fill="#fff" stroke="#4f8589" stroke-width="8"/>
    <path d="M657 535L671 550L697 519" fill="none" stroke="#4f8589" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M1040 670 C1130 615 1210 550 1280 465 C1345 385 1390 310 1465 230" fill="none" stroke="url(#path)" stroke-width="110" opacity="0.78"/>
  <path d="M1040 670 C1130 615 1210 550 1280 465 C1345 385 1390 310 1465 230" fill="none" stroke="#fff" stroke-width="8" stroke-dasharray="16 22" opacity="0.65"/>
  <circle cx="1100" cy="630" r="24" fill="#fff" stroke="#4e8288" stroke-width="8"/>
  <path d="M1068 630H1132" stroke="#4e8288" stroke-width="6" stroke-linecap="round"/>
  <path d="M1100 598V662" stroke="#4e8288" stroke-width="6" stroke-linecap="round"/>
  <g fill="#fff" stroke="#56868b" stroke-width="7">
    <circle cx="1360" cy="150" r="18"/><circle cx="1440" cy="95" r="18"/><circle cx="1520" cy="150" r="18"/>
  </g>
  <path d="M1360 150L1440 95L1520 150" fill="none" stroke="#56868b" stroke-width="7" opacity="0.56"/>
</svg>
